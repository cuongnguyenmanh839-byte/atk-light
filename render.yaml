services:
  - type: web
    name: atk-light-system
    env: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/system/health
    envVars:
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        value: file:/app/data/prod.db
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ESP32_URL
        value: http://192.168.137.195
      - key: ESP32_TOKEN
        value: atk2026
